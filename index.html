<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Gallery Coffee • Live Selfie</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: #0f141c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      overflow: hidden;
    }
    header {
      text-align: center;
      margin-top: 8px;
    }
    header h1 {
      font-size: 19px;
      font-weight: 700;
      color: #f7c948;
      letter-spacing: 0.3px;
    }
    header p {
      font-size: 13px;
      color: #9fb3c8;
      margin-top: 2px;
    }
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 65vh;
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, #preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Mirror front camera for natural selfie experience */
    .mirrored {
      transform: scaleX(-1);
    }
    .guide-box {
      position: absolute;
      width: 78%;
      height: 72%;
      border: 2px dashed rgba(247, 201, 72, 0.65);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.28);
    }
    .controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 12px 0 20px 0;
    }
    .shutter-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ffffff;
      border: 5px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s;
    }
    .shutter-btn:active {
      transform: scale(0.92);
      background: #f7c948;
    }
    .shutter-inner {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #f7c948;
    }
    .action-btn {
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s, transform 0.15s;
    }
    .action-btn:active {
      transform: scale(0.96);
    }
    .btn-retake {
      background: #334e68;
      color: #fff;
    }
    .btn-confirm {
      background: #10b981;
      color: #fff;
    }
    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 20, 28, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(247, 201, 72, 0.2);
      border-top-color: #f7c948;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #error-msg {
      background: #b91c1c;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      text-align: center;
      max-width: 320px;
      display: none;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>☕ The Gallery Coffee</h1>
    <p>Live Attendance Selfie (No phone storage used)</p>
  </header>

  <div id="error-msg"></div>

  <div class="camera-container">
    <video id="video" autoplay playsinline muted class="mirrored"></video>
    <img id="preview" style="display: none;">
    <div class="guide-box" id="guide"></div>

    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <p id="loading-text" style="font-size: 14px; color: #f7c948; font-weight: 500;">Connecting to camera...</p>
    </div>
  </div>

  <!-- Live Camera Controls -->
  <div class="controls" id="live-controls">
    <button class="icon-btn" id="flip-btn" title="Flip Camera">🔄</button>
    <div class="shutter-btn" id="snap-btn">
      <div class="shutter-inner"></div>
    </div>
    <div style="width: 48px;"></div> <!-- Spacer for balance -->
  </div>

  <!-- Captured Preview Controls -->
  <div class="controls" id="preview-controls" style="display: none;">
    <button class="action-btn btn-retake" id="retake-btn">🔄 Retake</button>
    <button class="action-btn btn-confirm" id="confirm-btn">✅ Submit Selfie</button>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    // Initialize Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Parse URL Hash parameters (#t=BOT_TOKEN&uid=USER_ID)
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const botToken = params.get("t");
    const userId = params.get("uid");

    const video = document.getElementById("video");
    const preview = document.getElementById("preview");
    const guide = document.getElementById("guide");
    const canvas = document.getElementById("canvas");
    const snapBtn = document.getElementById("snap-btn");
    const flipBtn = document.getElementById("flip-btn");
    const retakeBtn = document.getElementById("retake-btn");
    const confirmBtn = document.getElementById("confirm-btn");
    const liveControls = document.getElementById("live-controls");
    const previewControls = document.getElementById("preview-controls");
    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loading-text");
    const errorMsg = document.getElementById("error-msg");

    let currentStream = null;
    let facingMode = "user"; // default front camera
    let capturedBlob = null;

    function showError(text) {
      errorMsg.innerText = text;
      errorMsg.style.display = "block";
    }

    function showLoading(text) {
      loadingText.innerText = text;
      loading.style.display = "flex";
    }

    function hideLoading() {
      loading.style.display = "none";
    }

    async function initCamera() {
      showLoading("Opening camera...");
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        if (facingMode === "user") {
          video.classList.add("mirrored");
        } else {
          video.classList.remove("mirrored");
        }
        hideLoading();
      } catch (err) {
        hideLoading();
        showError("⚠️ Camera permission required. Please allow camera access in your browser settings.");
      }
    }

    // Switch between front and back camera
    flipBtn.addEventListener("click", () => {
      facingMode = (facingMode === "user") ? "environment" : "user";
      initCamera();
    });

    // Snap Selfie
    snapBtn.addEventListener("click", () => {
      const vWidth = video.videoWidth || 720;
      const vHeight = video.videoHeight || 1280;

      canvas.width = vWidth;
      canvas.height = vHeight;
      const ctx = canvas.getContext("2d");

      if (facingMode === "user") {
        ctx.translate(vWidth, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0, vWidth, vHeight);

      canvas.toBlob((blob) => {
        capturedBlob = blob;
        preview.src = URL.createObjectURL(blob);

        video.style.display = "none";
        preview.style.display = "block";
        guide.style.display = "none";

        liveControls.style.display = "none";
        previewControls.style.display = "flex";
      }, "image/jpeg", 0.88);
    });

    // Retake
    retakeBtn.addEventListener("click", () => {
      preview.style.display = "none";
      video.style.display = "block";
      guide.style.display = "block";

      liveControls.style.display = "flex";
      previewControls.style.display = "none";
      capturedBlob = null;
    });

    // Confirm & Submit directly into Telegram Bot
    confirmBtn.addEventListener("click", async () => {
      if (!capturedBlob) return;

      if (!botToken || !userId) {
        showError("Missing bot configuration. Please reopen from Telegram.");
        return;
      }

      showLoading("📤 Sending selfie to bot...");

      try {
        const formData = new FormData();
        formData.append("chat_id", userId);
        formData.append("photo", capturedBlob, "selfie.jpg");

        const response = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
          method: "POST",
          body: formData
        });

        const resData = await response.json();
        if (resData.ok) {
          const photos = resData.result.photo;
          const bestPhoto = photos[photos.length - 1];
          const payload = JSON.stringify({
            file_id: bestPhoto.file_id,
            message_id: resData.result.message_id
          });

          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.sendData) {
            window.Telegram.WebApp.sendData(payload);
          } else {
            showLoading("✅ Done! You can close this window.");
          }
        } else {
          hideLoading();
          showError("Telegram error: " + (resData.description || "Failed to send photo"));
        }
      } catch (err) {
        hideLoading();
        showError("Network error. Please check your internet connection.");
      }
    });

    // Start on load
    initCamera();
  </script>
</body>
</html>
